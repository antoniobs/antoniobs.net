name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build antoniobs.net release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: antoniobs.net-${{ github.ref_name }}
          path: dist/

  deploy:
    name: Deploy antoniobs.net production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: antoniobs.net-${{ github.ref_name }}
          path: dist/

      - name: Show release
        run: |
          echo "Deploying ${{ github.ref_name }}"
          echo "Files:"
          find dist -type f